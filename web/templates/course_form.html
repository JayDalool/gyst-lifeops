{{define "content"}}
<div class="gyst-scope courses-ui">
<div class="gyst-header">
  <div>
    <p class="kicker"><a href="/courses">Courses</a></p>
    <h1 class="gyst-page-title">{{.Title}}</h1>
    <p class="gyst-caption">Anything self-paced counts &mdash; Udemy, a bootcamp, a YouTube series. Fields marked <em class="req">*</em> are required.</p>
  </div>
  <a class="btn quiet" href="/courses">Cancel</a>
</div>

<form class="card form-card form-stack mt-24" method="post" action="{{.Action}}">
  <label class="field">
    <span>Course name <em class="req">*</em></span>
    <input name="name" required value="{{.Course.Name}}" placeholder="e.g. The Complete SQL Bootcamp">
  </label>
  <div class="form-row">
    <label class="field">
      <span>Provider</span>
      <input name="provider" value="{{.Course.Provider}}" placeholder="Udemy, YouTube&hellip;" list="provider-list">
      <datalist id="provider-list">
        <option value="Udemy"></option>
        <option value="Proda Academy"></option>
        <option value="Coursera"></option>
        <option value="YouTube"></option>
        <option value="Bootcamp"></option>
        <option value="Custom"></option>
      </datalist>
    </label>
    <label class="field">
      <span>Instructor</span>
      <input name="instructor" value="{{.Course.Instructor}}" placeholder="optional">
    </label>
  </div>
  <label class="field">
    <span>Course URL</span>
    <input type="url" name="url" value="{{.Course.URL}}" placeholder="https://&hellip;">
  </label>
  <div class="form-row">
    <label class="field">
      <span>Status</span>
      <select name="status">
        <option value="active" {{if eq .Course.Status "active"}}selected{{end}}>Active</option>
        <option value="paused" {{if eq .Course.Status "paused"}}selected{{end}}>Paused</option>
        <option value="completed" {{if eq .Course.Status "completed"}}selected{{end}}>Completed</option>
        <option value="archived" {{if eq .Course.Status "archived"}}selected{{end}}>Archived</option>
      </select>
    </label>
    <label class="field">
      <span>Progress %</span>
      <input type="number" name="progress_percent" min="0" max="100" value="{{.Course.ProgressPercent}}">
    </label>
  </div>
  <label class="field">
    <span>Target completion</span>
    <input type="date" name="target_date" value="{{.Course.TargetDate}}">
  </label>
  <label class="field">
    <span>Notes</span>
    <textarea name="notes" rows="4" placeholder="What you're learning, why, key topics&hellip;">{{.Course.Notes}}</textarea>
  </label>
  <button class="btn" type="submit">Save course</button>
</form>
</div>
{{end}}
