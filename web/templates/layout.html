{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeOps</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/styles.css?v=design-2">
  <script defer src="/static/js/charts.js?v=polish-5"></script>
  <script defer src="/static/js/app.js?v=2"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">LifeOps <span>Mission Control</span></a>
      <nav aria-label="Primary">
        <a href="/" {{if eq .Page "today"}}aria-current="page"{{end}}>Today</a>
        <a href="/galaxy" {{if eq .Page "projects"}}aria-current="page"{{end}}>Galaxy</a>

        <details class="nav-menu">
          <summary>Add</summary>
          <div class="nav-menu-popover">
            <a href="/tasks/new">Task</a>
            <a href="/projects/new">Project</a>
            <a href="/courses/new">Course</a>
          </div>
        </details>

        <details class="nav-menu" {{if or (eq .Page "courses") (eq .Page "monthly") (eq .Page "analytics") (eq .Page "health") (eq .Page "archive") (eq .Page "tasks") (eq .Page "goals") (eq .Page "reminders") (eq .Page "settings")}}data-active="true"{{end}}>
          <summary>More</summary>
          <div class="nav-menu-popover nav-menu-more">
            <a href="/courses">Courses</a>
            <a href="/monthly">Monthly</a>
            <a href="/analytics">Analytics</a>
            <a href="/health">Health</a>
            <a href="/archive">Archive</a>
            <a href="/tasks">All tasks</a>
            <a href="/goals">Goals</a>
            <a href="/reminders">Reminders</a>
            <a href="/settings">Settings</a>
          </div>
        </details>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
