{{define "content"}}
<div class="page-head">
  <div>
    <p class="kicker"><a href="/roadmap">Roadmaps</a></p>
    <h1 class="page-title">{{.Title}}</h1>
    <p class="page-sub">A roadmap groups projects into one long-term route. Fields marked <em class="req">*</em> are required.</p>
  </div>
  <a class="btn quiet" href="/roadmap">Cancel</a>
</div>

<form class="card form-card form-stack mt-24" method="post" action="{{.Action}}">
  <label class="field">
    <span>Name <em class="req">*</em></span>
    <input name="name" value="{{.Roadmap.Name}}" required>
  </label>
  <label class="field">
    <span>Description</span>
    <textarea name="description" rows="3">{{.Roadmap.Description}}</textarea>
  </label>
  <div class="form-row">
    <label class="field">
      <span>Priority</span>
      <input type="number" name="priority" value="{{.Roadmap.Priority}}">
    </label>
    <label class="field">
      <span>Status</span>
      <select name="status">
        {{$s := .Roadmap.Status}}
        <option value="active" {{if eq $s "active"}}selected{{end}}>Active</option>
        <option value="upcoming" {{if eq $s "upcoming"}}selected{{end}}>Upcoming</option>
        <option value="locked" {{if eq $s "locked"}}selected{{end}}>Locked</option>
        <option value="done" {{if eq $s "done"}}selected{{end}}>Done</option>
      </select>
    </label>
  </div>
  <div class="form-row">
    <label class="field">
      <span>Privacy</span>
      <select name="privacy">
        {{$p := .Roadmap.Privacy}}
        <option value="private" {{if eq $p "private"}}selected{{end}}>Private</option>
        <option value="public" {{if eq $p "public"}}selected{{end}}>Public</option>
        <option value="local_only" {{if eq $p "local_only"}}selected{{end}}>Local only</option>
      </select>
    </label>
    <label class="field">
      <span>Color</span>
      <select name="color">
        {{$c := .Roadmap.Color}}
        <option value="cyan" {{if eq $c "cyan"}}selected{{end}}>Cyan</option>
        <option value="blue" {{if eq $c "blue"}}selected{{end}}>Blue</option>
        <option value="green" {{if eq $c "green"}}selected{{end}}>Green</option>
        <option value="amber" {{if eq $c "amber"}}selected{{end}}>Amber</option>
      </select>
    </label>
  </div>
  <label class="field">
    <span>Icon</span>
    <input name="icon" value="{{.Roadmap.Icon}}" placeholder="rocket">
  </label>
  <div class="flag-row">
    <label><input type="checkbox" name="featured" {{if .Roadmap.Featured}}checked{{end}}> Show on the dashboard</label>
  </div>
  <button class="btn" type="submit">{{if .IsEdit}}Save roadmap{{else}}Create roadmap{{end}}</button>
</form>

{{if .IsEdit}}
  <div class="flag-row mt-16">
    <form method="post" action="/roadmaps/{{.Roadmap.ID}}/archive" onsubmit="return confirm('Archive this roadmap?')">
      <button class="btn sm danger" type="submit">Archive roadmap</button>
    </form>
  </div>
{{end}}
{{end}}
