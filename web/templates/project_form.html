{{define "content"}}
<div class="gyst-scope projects-ui project-form-ui">
<div class="gyst-header">
  <div>
    <p class="kicker"><a href="/projects">Projects</a></p>
    <h1 class="gyst-page-title">{{.Title}}</h1>
    <p class="page-sub">Fields marked <em class="req">*</em> are required.</p>
  </div>
  <a class="btn quiet" href="/projects">Cancel</a>
</div>

<form class="card form-card form-stack mt-24" method="post" action="{{.Action}}">
  <label class="field">
    <span>Name <em class="req">*</em></span>
    <input name="name" required value="{{.Project.Name}}">
  </label>
  <label class="field">
    <span>Description</span>
    <textarea name="description" rows="4">{{.Project.Description}}</textarea>
  </label>
  <div class="form-row">
    <label class="field">
      <span>Category</span>
      <select name="category">
        <option value="coding" {{if eq .Project.Category "coding"}}selected{{end}}>Coding</option>
        <option value="sim rig" {{if eq .Project.Category "sim rig"}}selected{{end}}>Sim rig</option>
        <option value="car" {{if eq .Project.Category "car"}}selected{{end}}>Car</option>
        <option value="health" {{if eq .Project.Category "health"}}selected{{end}}>Health</option>
        <option value="business" {{if eq .Project.Category "business"}}selected{{end}}>Business</option>
        <option value="personal" {{if eq .Project.Category "personal"}}selected{{end}}>Personal</option>
        <option value="other" {{if eq .Project.Category "other"}}selected{{end}}>Other</option>
      </select>
    </label>
    <label class="field">
      <span>Project color</span>
      <select name="color">
        <option value="cyan" {{if eq .Project.Color "cyan"}}selected{{end}}>Cyan</option>
        <option value="violet" {{if eq .Project.Color "violet"}}selected{{end}}>Violet</option>
        <option value="emerald" {{if eq .Project.Color "emerald"}}selected{{end}}>Emerald</option>
        <option value="amber" {{if eq .Project.Color "amber"}}selected{{end}}>Amber</option>
        <option value="rose" {{if eq .Project.Color "rose"}}selected{{end}}>Rose</option>
        <option value="blue" {{if eq .Project.Color "blue"}}selected{{end}}>Blue</option>
        <option value="orange" {{if eq .Project.Color "orange"}}selected{{end}}>Orange</option>
        <option value="magenta" {{if eq .Project.Color "magenta"}}selected{{end}}>Magenta</option>
      </select>
    </label>
  </div>
  <div class="form-row">
    <label class="field">
      <span>Kind</span>
      <select name="project_kind">
        <option value="main" {{if eq .Project.ProjectKind "main"}}selected{{end}}>Main project</option>
        <option value="subproject" {{if eq .Project.ProjectKind "subproject"}}selected{{end}}>Subproject</option>
        <option value="phase" {{if eq .Project.ProjectKind "phase"}}selected{{end}}>Phase / chapter</option>
      </select>
    </label>
  </div>
  <div class="form-row">
    <label class="field">
      <span>Roadmap</span>
      <select name="roadmap_id">
        <option value="">Unassigned</option>
        {{range .Roadmaps}}
          <option value="{{.ID}}" {{if eq .ID $.Project.RoadmapID}}selected{{end}}>{{.Name}}</option>
        {{end}}
      </select>
    </label>
    <label class="field">
      <span>Parent project</span>
      <select name="parent_project_id">
        <option value="">None</option>
        {{range .Projects}}
          {{if ne .Project.ID $.Project.ID}}
            <option value="{{.Project.ID}}" {{if eq .Project.ID $.Project.ParentProjectID}}selected{{end}}>{{.Project.Name}}</option>
          {{end}}
        {{end}}
      </select>
    </label>
  </div>
  <label class="field">
    <span>Status</span>
    <select name="status">
      <option value="active" {{if eq .Project.Status "active"}}selected{{end}}>Active</option>
      <option value="upcoming" {{if eq .Project.Status "upcoming"}}selected{{end}}>Upcoming</option>
      <option value="locked" {{if eq .Project.Status "locked"}}selected{{end}}>Locked</option>
      <option value="done" {{if eq .Project.Status "done"}}selected{{end}}>Done</option>
      <option value="archived" {{if eq .Project.Status "archived"}}selected{{end}}>Archived</option>
    </select>
  </label>
  <div class="form-row">
    <label class="field">
      <span>Start date</span>
      <input type="date" name="start_date" value="{{.Project.StartDate}}">
    </label>
    <label class="field">
      <span>Target date</span>
      <input type="date" name="target_date" value="{{.Project.TargetDate}}">
    </label>
  </div>
  <label class="field">
    <span>Notes</span>
    <textarea name="notes" rows="4">{{.Project.Notes}}</textarea>
  </label>

  <p class="group-label">Unlocking (optional)</p>
  <label class="field">
    <span>Depends on</span>
    <select name="depends_on_project_id">
      <option value="">None</option>
      {{range .Projects}}
        {{if ne .Project.ID $.Project.ID}}
          <option value="{{.Project.ID}}" {{if eq .Project.ID $.Project.DependsOnProjectID}}selected{{end}}>{{.Project.Name}}</option>
        {{end}}
      {{end}}
    </select>
  </label>
  <label class="field">
    <span>Unlock notes</span>
    <textarea name="unlock_notes" rows="2" placeholder="Shown while this project is locked or upcoming.">{{.Project.UnlockNotes}}</textarea>
  </label>
  <div class="flag-row">
    <label><input type="checkbox" name="auto_unlock" {{if .Project.AutoUnlock}}checked{{end}}> Unlock automatically when the dependency is done</label>
  </div>

  <button class="btn" type="submit">Save project</button>
</form>
</div>
{{end}}
