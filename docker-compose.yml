x-logging: &gyst-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gyst-lifeops:
    build: .
    container_name: gyst-lifeops
    restart: unless-stopped
    logging: *gyst-logging
    healthcheck:
      test: ["CMD", "/app/lifeops", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./data:/app/data
    environment:
      - HEVY_API_KEY=${HEVY_API_KEY:-}
      - HEALTH_AI_PROVIDER=${HEALTH_AI_PROVIDER:-}
      - HEALTH_AI_MODEL=${HEALTH_AI_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GYST_HEALTH_SYNC_TOKEN=${GYST_HEALTH_SYNC_TOKEN:-}
      - GYST_N8N_EVENT_TOKEN=${GYST_N8N_EVENT_TOKEN:-}
      - GYST_N8N_WORKFLOWS=${GYST_N8N_WORKFLOWS:-}
      - GYST_N8N_URL=${GYST_N8N_URL:-}
      - GYST_PASSWORD_HASH=${GYST_PASSWORD_HASH:-}
      - GYST_AUTH_DISABLED=${GYST_AUTH_DISABLED:-}
      - PORT=8080
      - DB_PATH=/app/data/lifeops.db
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBSCRIBER=${VAPID_SUBSCRIBER:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
  caddy:
    image: caddy:2.10.2-alpine
    container_name: gyst-caddy
    restart: unless-stopped
    logging: *gyst-logging
    environment:
      - GYST_TLS_HOSTNAME=${GYST_TLS_HOSTNAME:?Set the full Tailscale MagicDNS hostname}
    networks:
      - default
      - proxy
    depends_on:
      - gyst-lifeops
    ports:
      - "3443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Mount the directory so a tailscaled restart can replace its socket.
      - type: bind
        source: /var/run/tailscale
        target: /var/run/tailscale
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
    name: proxy
